# Two services from one image (T13, #24): the MCP server over streamable HTTP,
# and the chatbot that talks to it.
#
# The MCP server binds 127.0.0.1 only and no MCP port is published (U11, #15):
# the chatbot shares its network namespace and reaches it over loopback, so no
# other container or host can. T14's secret makes leaving loopback safe; that move is M4.
# Loopback also keeps FastMCP's DNS-rebinding allowlist (127.0.0.1, localhost)
# valid without changes.
#
# Admission (T14, #72): the chatbot sends DTCC_MCP_SECRET on every MCP call,
# and opening a chat needs DTCC_AGENT_ACCESS_CODE. Compose refuses to start
# without either, so a deployment can't run open by accident.
#
# Both mount the same /data: the MCP server writes each Session's artifacts to
# /data/artifacts and the chatbot serves them from there (T7, #21).

x-image: &image
  image: ${DTCC_AGENT_IMAGE:-dtcc-agent}:${DTCC_AGENT_TAG:-local}
  platform: ${DOCKER_PLATFORM:-linux/amd64}

services:
  dtcc-agent-mcp:
    <<: *image
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
        EXTRAS: ${EXTRAS:-chatbot,sdk}
    command: ["python", "-m", "dtcc_agent"]
    # A crash must not leave the chat down until someone notices (#79). The
    # limit makes the kernel kill this server, not a neighbour, if one
    # operation still outgrows memory despite the download cap.
    restart: unless-stopped
    mem_limit: ${DTCC_MCP_MEM_LIMIT:-5g}
    # The chatbot listens inside this service's network namespace, so its
    # port is published here. The MCP port (8051) is not.
    ports:
      - "8050:8050"
    environment:
      - DTCC_MCP_TRANSPORT=http
      - DTCC_MCP_HOST=127.0.0.1
      - DTCC_MCP_PORT=8051
      - DTCC_MCP_SECRET=${DTCC_MCP_SECRET:?set DTCC_MCP_SECRET}
      - DTCC_AGENT_LOG_DIR=/data/logs
      - DTCC_AGENT_CACHE_DIR=/data/cache
      - DTCC_REMOTE_SERVICES=${DTCC_REMOTE_SERVICES:-http://host.docker.internal:8001}
      - DTCC_SIM_SERVICE_URL=${DTCC_SIM_SERVICE_URL:-}
      - SHARED_RESULTS_DIR=/shared/results
    volumes:
      - ${DTCC_AGENT_DATA:-./data/agent}:/data
      - ${DTCC_SHARED_RESULTS:-../dtcc-sim/data/shared-results}:/shared/results
    healthcheck:
      # Listening means the catalogue is built: the server builds it before
      # it accepts connections, and exits if a Core section fails (#22).
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8051), 2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s

  dtcc-agent:
    <<: *image
    network_mode: "service:dtcc-agent-mcp"
    restart: unless-stopped
    depends_on:
      dtcc-agent-mcp:
        condition: service_healthy
    environment:
      - DTCC_MCP_URL=http://127.0.0.1:8051/mcp
      - DTCC_MCP_SECRET=${DTCC_MCP_SECRET:?set DTCC_MCP_SECRET}
      - DTCC_AGENT_ACCESS_CODE=${DTCC_AGENT_ACCESS_CODE:?set DTCC_AGENT_ACCESS_CODE}
      - DTCC_AGENT_HOST=0.0.0.0
      - DTCC_AGENT_PORT=8050
      - DTCC_AGENT_LOG_DIR=/data/logs
      - DTCC_AGENT_MEMORY_DIR=/data/memory
      # The model runs on Amazon Bedrock (#29); see README, "The model".
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK:?set AWS_BEARER_TOKEN_BEDROCK}
      - AWS_REGION=${AWS_REGION:-eu-north-1}
      - DTCC_AGENT_MODEL=${DTCC_AGENT_MODEL:-eu.anthropic.claude-sonnet-5-5}
      # pydantic-ai, or sdk to roll back to the Agent SDK (#86).
      - DTCC_AGENT_RUNTIME=${DTCC_AGENT_RUNTIME:-pydantic-ai}
      # Temporary while #87 measures the catalogue variants: summary or full.
      - DTCC_AGENT_CATALOGUE=${DTCC_AGENT_CATALOGUE:-summary}
    volumes:
      - ${DTCC_AGENT_DATA:-./data/agent}:/data
    healthcheck:
      # Healthy means this chat is reachable and can reach the MCP server. If
      # the MCP server restarts (say after an out-of-memory kill), this
      # container is left in the old, dead network namespace, and Docker never
      # restarts a container for being unhealthy. So a failed check stops the
      # chatbot (PID 1), and restart: unless-stopped brings it back inside the
      # new namespace (#79). Separating the two networks is M4.
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket, urllib.request; urllib.request.urlopen('http://localhost:8050/health', timeout=3); socket.create_connection(('127.0.0.1', 8051), 2)\" || kill 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
