[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dtcc-agent"
version = "0.1.0"
description = "LLM agent interface for the DTCC digital twin platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Vasilis Naserentin", email = "vasilis.naserentin@chalmers.se" },
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  # Pinned to a commit, as dtcc-sim does. dtcc_core exposes no __version__, so
  # the SHA is the only version handle there is. Do not move this pin by hand:
  # .github/workflows/dtcc-core-contract.yml tests a candidate Core against
  # this package first.
  #
  # bb95f2f is the revision this package's suite is green against (133
  # operations; any section failing to register stops startup, #22). It
  # carries dtcc-core#126, #128 and #132, which dtcc-agent relies on (#59).
  # dtcc-sim pins an older Core; the two repos are deliberately not
  # required to match.
  "dtcc-core @ git+https://github.com/dtcc-platform/dtcc-core.git@bb95f2f8c338e6433a1e6a48375cf634710ff421",
  # mcp 2.x: server.py uses MCPServer (FastMCP's 2.x name) and reads request
  # headers from the injected Context. The upper bound guards the next major,
  # as <2 once guarded this one. See tests/test_server_import.py.
  "mcp>=2.3.0,<3",
  "httpx>=0.27.0",
  "pyproj>=3.6.0",
  "numpy",
  # render_object draws with the Agg backend: no OpenGL or display (U9).
  "matplotlib>=3.8",
  # server.py runs every tool in a worker thread via anyio (M1a/T4).
  "anyio>=4",
]

[project.optional-dependencies]
test = ["pytest"]
chatbot = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # 0.1.39 crashed every chat turn on the current Claude CLI's rate_limit_event
    # (MessageParseError). 0.2.163 is the version verified end to end. The SDK
    # leaves with the pydantic-ai rebuild (ADR-0003, M3).
    "claude-agent-sdk>=0.2.163",
    "websockets>=13.0",
    "chromadb>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/dtcc-platform/dtcc-agent"
Source = "https://github.com/dtcc-platform/dtcc-agent"

[tool.setuptools.packages.find]
where = ["."]
include = ["dtcc_agent*", "chatbot*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["external: tests that require network access"]
